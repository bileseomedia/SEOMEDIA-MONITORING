<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS - Task Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100">

<!-- ========== HALAMAN LOGIN ========== -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 to-purple-800">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl max-w-md w-full p-8 border border-white/20">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-chart-line text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">AgencyOS</h1>
            <p class="text-purple-200 text-sm">Task Management & Financial System</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-white text-sm font-semibold mb-2">Pilih Role</label>
                <select id="loginRole" class="w-full bg-white/20 border border-white/30 text-white rounded-xl px-4 py-3">
                    <option value="eksekutor" class="text-gray-900">🔧 Eksekutor - Pengerja Task</option>
                    <option value="maker" class="text-gray-900">👑 Maker - Bos / Owner</option>
                </select>
            </div>
            <div>
                <label class="block text-white text-sm font-semibold mb-2">Nama / Username</label>
                <input type="text" id="loginName" placeholder="Masukkan nama Anda" class="w-full bg-white/20 border border-white/30 text-white rounded-xl px-4 py-3 placeholder:text-purple-200">
            </div>
            <button onclick="doLogin()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition">
                <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Masuk ke Dashboard
            </button>
        </div>
        <div class="mt-6 text-center text-xs text-purple-200">
            Demo: Eksekutor = "Andi" / Maker = "Bos"
        </div>
    </div>
</div>

<!-- ========== DASHBOARD UTAMA ========== -->
<div id="dashboardPage" class="hidden flex h-screen">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-gray-900 text-white w-64 flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all z-30">
        <div class="p-5 border-b border-gray-800">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="font-bold text-xl">AgencyOS</h1>
                    <p class="text-xs text-gray-400" id="roleBadge"></p>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
        </div>
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
            <div id="navMenuEksekutor" class="hidden">
                <button onclick="switchTab('eksekutorDashboard')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-chart-line w-5 mr-2"></i> Dashboard
                </button>
                <button onclick="switchTab('taskBoard')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-tasks w-5 mr-2"></i> Task Board
                </button>
                <button onclick="switchTab('myReports')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-chart-simple w-5 mr-2"></i> Laporan Saya
                </button>
            </div>
            <div id="navMenuMaker" class="hidden">
                <button onclick="switchTab('makerDashboard')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-chart-line w-5 mr-2"></i> Dashboard
                </button>
                <button onclick="switchTab('manageProjects')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-folder w-5 mr-2"></i> Kelola Project
                </button>
                <button onclick="switchTab('manageTasks')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-list-check w-5 mr-2"></i> Kelola Task
                </button>
                <button onclick="switchTab('financialReport')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-chart-pie w-5 mr-2"></i> Laporan Keuangan
                </button>
                <button onclick="switchTab('operasional')" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition mb-1">
                    <i class="fa-solid fa-receipt w-5 mr-2"></i> Biaya Operasional
                </button>
            </div>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center justify-between">
                <div class="text-xs text-gray-400">
                    <i class="fa-regular fa-user mr-1"></i>
                    <span id="userNameDisplay"></span>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-white text-sm">
                    <i class="fa-solid fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 id="pageTitle" class="text-xl font-bold text-gray-800">Dashboard</h2>
            </div>
            <div class="bg-indigo-100 w-10 h-10 rounded-full flex items-center justify-center">
                <i class="fa-regular fa-bell text-indigo-600"></i>
            </div>
        </header>
        <div id="contentContainer" class="flex-1 overflow-auto p-6">
            <!-- Konten diisi JavaScript -->
        </div>
    </main>
</div>

<script>
    // ========== GLOBAL VARIABLES ==========
    let currentUser = null;
    let currentTab = 'eksekutorDashboard';
    
    // Data State
    let state = {
        users: [],
        projects: [],
        tasks: [],
        assignments: [],
        ecommerce: [],
        operationalExpenses: [],
        cashflow: []
    };
    
    // Default Data
    const defaultData = {
        users: [
            { id: "U001", name: "Andi", role: "eksekutor", createdAt: new Date().toISOString() },
            { id: "U002", name: "Bos", role: "maker", createdAt: new Date().toISOString() }
        ],
        projects: [
            { id: "P001", name: "Website PT ABC", client: "PT ABC", clientValue: 10000000, status: "active", createdAt: new Date().toISOString() }
        ],
        tasks: [
            { id: "T001", projectId: "P001", name: "🔍 Cari Domain", estMinutes: 15, fee: 50000, status: "available" },
            { id: "T002", projectId: "P001", name: "🌐 Setting Hosting", estMinutes: 20, fee: 75000, status: "available" },
            { id: "T003", projectId: "P001", name: "🎨 Install WordPress", estMinutes: 30, fee: 100000, status: "available" }
        ],
        assignments: [],
        ecommerce: [],
        operationalExpenses: [],
        cashflow: []
    };
    
    // ========== HELPER FUNCTIONS ==========
    function showToast(message, type = 'success') {
        let toast = document.createElement('div');
        toast.className = 'fixed bottom-5 right-5 bg-gray-800 text-white px-5 py-3 rounded-xl shadow-2xl z-50 transition-all';
        toast.innerHTML = `<i class="fa-solid fa-circle-check text-green-400 mr-2"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        let d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    
    function getMonthKey(dateStr) {
        let d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }
    
    // ========== LOCAL STORAGE ==========
    function loadAllData() {
        const saved = localStorage.getItem('agencyos_data');
        if (saved) {
            try {
                state = JSON.parse(saved);
            } catch(e) { console.error(e); state = JSON.parse(JSON.stringify(defaultData)); }
        } else {
            state = JSON.parse(JSON.stringify(defaultData));
        }
    }
    
    function saveAllData() {
        localStorage.setItem('agencyos_data', JSON.stringify(state));
    }
    
    // ========== LOGIN SYSTEM ==========
    function doLogin() {
        const role = document.getElementById('loginRole').value;
        const name = document.getElementById('loginName').value.trim();
        
        if (!name) {
            alert('Masukkan nama Anda!');
            return;
        }
        
        // Cari atau buat user
        let user = state.users.find(u => u.name.toLowerCase() === name.toLowerCase());
        if (!user) {
            user = {
                id: "U" + (state.users.length + 1).toString().padStart(3, '0'),
                name: name,
                role: role,
                createdAt: new Date().toISOString()
            };
            state.users.push(user);
            saveAllData();
        }
        
        currentUser = user;
        sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
        
        // Tampilkan dashboard
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashboardPage').classList.remove('hidden');
        
        initDashboard();
    }
    
    function logout() {
        currentUser = null;
        sessionStorage.removeItem('currentUser');
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('dashboardPage').classList.add('hidden');
    }
    
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }
    
    function initDashboard() {
        document.getElementById('userNameDisplay').innerText = currentUser.name;
        document.getElementById('roleBadge').innerHTML = currentUser.role === 'maker' ? '👑 Owner' : '🔧 Eksekutor';
        
        if (currentUser.role === 'maker') {
            document.getElementById('navMenuMaker').classList.remove('hidden');
            document.getElementById('navMenuEksekutor').classList.add('hidden');
        } else {
            document.getElementById('navMenuMaker').classList.add('hidden');
            document.getElementById('navMenuEksekutor').classList.remove('hidden');
        }
        
        switchTab('eksekutorDashboard');
    }
    
    function switchTab(tab) {
        currentTab = tab;
        const titles = {
            eksekutorDashboard: '📊 Dashboard Saya',
            taskBoard: '📋 Task Board',
            myReports: '💰 Laporan Pendapatan',
            makerDashboard: '👑 Dashboard Owner',
            manageProjects: '📁 Kelola Project',
            manageTasks: '✅ Kelola Task',
            financialReport: '📈 Laporan Keuangan',
            operasional: '💸 Biaya Operasional'
        };
        document.getElementById('pageTitle').innerText = titles[tab] || 'Dashboard';
        renderCurrentTab();
        if (window.innerWidth < 768) {
            document.getElementById('sidebar').classList.add('-translate-x-full');
        }
    }
    
    function renderCurrentTab() {
        const container = document.getElementById('contentContainer');
        
        if (currentUser.role === 'maker') {
            if (currentTab === 'makerDashboard') renderMakerDashboard(container);
            else if (currentTab === 'manageProjects') renderManageProjects(container);
            else if (currentTab === 'manageTasks') renderManageTasks(container);
            else if (currentTab === 'financialReport') renderFinancialReport(container);
            else if (currentTab === 'operasional') renderOperasional(container);
            else renderMakerDashboard(container);
        } else {
            if (currentTab === 'eksekutorDashboard') renderEksekutorDashboard(container);
            else if (currentTab === 'taskBoard') renderTaskBoard(container);
            else if (currentTab === 'myReports') renderMyReports(container);
            else renderEksekutorDashboard(container);
        }
    }
    
    // ========== EKSEKUTOR DASHBOARD ==========
    function renderEksekutorDashboard(container) {
        const myAssignments = state.assignments.filter(a => a.executorId === currentUser.id);
        const completedTasks = myAssignments.filter(a => a.completed);
        const totalEarning = completedTasks.reduce((sum, a) => sum + (a.fee || 0), 0);
        const totalMinutes = completedTasks.reduce((sum, a) => sum + (a.timeSpent || 0), 0);
        
        container.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-gradient-to-r from-indigo-500 to-indigo-600 text-white p-6 rounded-2xl shadow-lg">
                    <p class="text-sm opacity-90">Total Pendapatan</p>
                    <p class="text-3xl font-bold mt-2">${formatRupiah(totalEarning)}</p>
                </div>
                <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-6 rounded-2xl shadow-lg">
                    <p class="text-sm opacity-90">Task Selesai</p>
                    <p class="text-3xl font-bold mt-2">${completedTasks.length} task</p>
                </div>
                <div class="bg-gradient-to-r from-orange-500 to-orange-600 text-white p-6 rounded-2xl shadow-lg">
                    <p class="text-sm opacity-90">Total Waktu</p>
                    <p class="text-3xl font-bold mt-2">${totalMinutes} menit</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h3 class="font-bold text-gray-800 mb-4">📊 Riwayat Pendapatan</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50">
                            <tr><th class="p-3 text-left">Tanggal</th><th class="p-3 text-left">Task</th><th class="p-3 text-left">Waktu</th><th class="p-3 text-left">Fee</th></tr>
                        </thead>
                        <tbody>
                            ${completedTasks.map(a => {
                                const task = state.tasks.find(t => t.id === a.taskId);
                                return `<tr class="border-t"><td class="p-3">${formatDate(a.completedDate)}</td><td class="p-3">${task?.name || '-'}</td><td class="p-3">${a.timeSpent} menit</td><td class="p-3 font-semibold text-green-600">${formatRupiah(a.fee)}</td></tr>`;
                            }).join('')}
                            ${completedTasks.length === 0 ? '<tr><td colspan="4" class="text-center py-8 text-gray-400">Belum ada task selesai</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }
    
    function renderTaskBoard(container) {
        const availableTasks = state.tasks.filter(t => t.status === 'available');
        const myActiveTasks = state.assignments.filter(a => a.executorId === currentUser.id && !a.completed);
        
        container.innerHTML = `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-2xl shadow-sm">
                    <div class="border-b p-5"><h3 class="font-bold"><i class="fa-solid fa-clock text-indigo-500 mr-2"></i> Task Tersedia</h3></div>
                    <div class="p-4 divide-y divide-gray-100">
                        ${availableTasks.length === 0 ? '<div class="text-center py-8 text-gray-400">Belum ada task</div>' : 
                            availableTasks.map(task => `
                                <div class="flex justify-between items-center py-3">
                                    <div><p class="font-semibold">${task.name}</p><div class="flex gap-3 mt-1 text-xs text-gray-500"><span>⏱️ ${task.estMinutes} menit</span><span class="text-green-600">${formatRupiah(task.fee)}</span></div></div>
                                    <button onclick="takeTask('${task.id}')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">Ambil</button>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm">
                    <div class="border-b p-5"><h3 class="font-bold"><i class="fa-solid fa-play-circle text-green-500 mr-2"></i> Task Dikerjakan</h3></div>
                    <div class="p-4 divide-y divide-gray-100">
                        ${myActiveTasks.length === 0 ? '<div class="text-center py-8 text-gray-400">Belum ada task diambil</div>' :
                            myActiveTasks.map(assign => {
                                const task = state.tasks.find(t => t.id === assign.taskId);
                                return `
                                    <div class="flex justify-between items-center py-3">
                                        <div><p class="font-semibold">${task?.name}</p><p class="text-xs text-gray-500">Estimasi: ${task?.estMinutes} menit • Fee: ${formatRupiah(task?.fee)}</p></div>
                                        <div class="flex gap-2"><input type="number" id="timeSpent_${assign.id}" placeholder="Menit" class="w-24 border rounded-lg px-2 py-1 text-sm"><button onclick="completeTask('${assign.id}')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-sm">Selesai</button></div>
                                    </div>
                                `;
                            }).join('')
                        }
                    </div>
                </div>
            </div>
        `;
    }
    
    function takeTask(taskId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task || task.status !== 'available') {
            showToast('Task tidak tersedia!', 'error');
            return;
        }
        
        task.status = 'assigned';
        const newAssign = {
            id: "A" + Date.now(),
            taskId: taskId,
            executorId: currentUser.id,
            executorName: currentUser.name,
            fee: task.fee,
            assignedAt: new Date().toISOString(),
            completed: false,
            timeSpent: null
        };
        state.assignments.push(newAssign);
        saveAllData();
        renderTaskBoard(document.getElementById('contentContainer'));
        showToast(`✅ Task "${task.name}" berhasil diambil!`);
    }
    
    function completeTask(assignId) {
        const assign = state.assignments.find(a => a.id === assignId);
        if (!assign || assign.completed) return;
        
        const timeSpent = parseInt(document.getElementById(`timeSpent_${assignId}`)?.value);
        if (!timeSpent || timeSpent <= 0) {
            showToast('Masukkan waktu yang dihabiskan!', 'error');
            return;
        }
        
        const task = state.tasks.find(t => t.id === assign.taskId);
        if (task) task.status = 'available';
        
        assign.completed = true;
        assign.timeSpent = timeSpent;
        assign.completedDate = new Date().toISOString();
        saveAllData();
        
        renderTaskBoard(document.getElementById('contentContainer'));
        showToast(`✅ Selesai! Dapat ${formatRupiah(assign.fee)} dalam ${timeSpent} menit`);
    }
    
    function renderMyReports(container) {
        const myCompleted = state.assignments.filter(a => a.executorId === currentUser.id && a.completed);
        const totalEarning = myCompleted.reduce((sum, a) => sum + (a.fee || 0), 0);
        
        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-indigo-50 p-4 rounded-xl text-center"><p class="text-sm text-gray-500">Total Pendapatan</p><p class="text-2xl font-bold text-indigo-600">${formatRupiah(totalEarning)}</p></div>
                    <div class="bg-green-50 p-4 rounded-xl text-center"><p class="text-sm text-gray-500">Task Selesai</p><p class="text-2xl font-bold text-green-600">${myCompleted.length} task</p></div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50"><tr><th class="p-3 text-left">Tanggal</th><th class="p-3 text-left">Task</th><th class="p-3 text-left">Waktu</th><th class="p-3 text-left">Fee</th></tr></thead>
                        <tbody>${myCompleted.map(a => {
                            const task = state.tasks.find(t => t.id === a.taskId);
                            return `<tr class="border-t"><td class="p-3">${formatDate(a.completedDate)}</td><td class="p-3">${task?.name || '-'}</td><td class="p-3">${a.timeSpent} menit</td><td class="p-3 font-semibold text-green-600">${formatRupiah(a.fee)}</td></tr>`;
                        }).join('')}</tbody>
                    </table>
                </div>
            </div>
        `;
    }
    
    // ========== MAKER FUNCTIONS ==========
    function renderMakerDashboard(container) {
        const totalProjects = state.projects.length;
        const totalTasks = state.tasks.length;
        const totalAssignments = state.assignments.filter(a => a.completed).length;
        const totalFeeOut = state.assignments.filter(a => a.completed).reduce((sum, a) => sum + (a.fee || 0), 0);
        
        container.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-5 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">Total Project</p><p class="text-2xl font-bold">${totalProjects}</p></div>
                <div class="bg-white p-5 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">Total Task</p><p class="text-2xl font-bold">${totalTasks}</p></div>
                <div class="bg-white p-5 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">Task Selesai</p><p class="text-2xl font-bold">${totalAssignments}</p></div>
                <div class="bg-white p-5 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">Fee Keluar</p><p class="text-2xl font-bold text-red-600">${formatRupiah(totalFeeOut)}</p></div>
            </div>
        `;
    }
    
    function renderManageProjects(container) {
        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
                <h3 class="font-bold mb-4">➕ Tambah Project</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="newProjectName" placeholder="Nama Project" class="border rounded-xl px-3 py-2">
                    <input type="text" id="newProjectClient" placeholder="Client" class="border rounded-xl px-3 py-2">
                    <input type="number" id="newProjectValue" placeholder="Nilai Project" class="border rounded-xl px-3 py-2">
                    <button onclick="addProject()" class="bg-indigo-600 text-white rounded-xl py-2">Simpan</button>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="border-b p-5"><h3 class="font-bold">📁 Daftar Project</h3></div>
                <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3">Nama</th><th class="p-3">Client</th><th class="p-3">Nilai</th><th class="p-3">Aksi</th></tr></thead><tbody>${state.projects.map(p => `<tr class="border-t"><td class="p-3">${p.name}</td><td class="p-3">${p.client || '-'}</td><td class="p-3">${formatRupiah(p.clientValue)}</td><td class="p-3"><button onclick="deleteProject('${p.id}')" class="text-red-500"><i class="fa-regular fa-trash-can"></i></button></td></tr>`).join('')}</tbody></table></div>
            </div>
        `;
    }
    
    function addProject() {
        const name = document.getElementById('newProjectName')?.value.trim();
        if (!name) { showToast('Nama project wajib diisi!', 'error'); return; }
        state.projects.push({ id: "P" + (state.projects.length + 1).toString().padStart(3, '0'), name: name, client: document.getElementById('newProjectClient')?.value || '-', clientValue: parseInt(document.getElementById('newProjectValue')?.value) || 0, status: 'active', createdAt: new Date().toISOString() });
        saveAllData();
        renderManageProjects(document.getElementById('contentContainer'));
        showToast('Project ditambahkan');
    }
    
    function deleteProject(id) {
        if (confirm('Hapus project?')) {
            state.projects = state.projects.filter(p => p.id !== id);
            saveAllData();
            renderManageProjects(document.getElementById('contentContainer'));
        }
    }
    
    function renderManageTasks(container) {
        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
                <h3 class="font-bold mb-4">➕ Tambah Task</h3>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <select id="taskProjectId" class="border rounded-xl px-3 py-2"><option value="">Pilih Project</option>${state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>
                    <input type="text" id="newTaskName" placeholder="Nama Task" class="border rounded-xl px-3 py-2">
                    <input type="number" id="newTaskMinutes" placeholder="Estimasi Menit" class="border rounded-xl px-3 py-2">
                    <input type="number" id="newTaskFee" placeholder="Fee (Rp)" class="border rounded-xl px-3 py-2">
                    <button onclick="addTask()" class="bg-indigo-600 text-white rounded-xl py-2">Simpan</button>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="border-b p-5"><h3 class="font-bold">✅ Daftar Task</h3></div>
                <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3">Task</th><th class="p-3">Project</th><th class="p-3">Estimasi</th><th class="p-3">Fee</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody>${state.tasks.map(t => { const p = state.projects.find(pj => pj.id === t.projectId); return `<tr class="border-t"><td class="p-3">${t.name}</td><td class="p-3">${p?.name || '-'}</td><td class="p-3">${t.estMinutes} mnt</td><td class="p-3">${formatRupiah(t.fee)}</td><td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${t.status === 'available' ? 'bg-green-100 text-green-700' : 'bg-yellow-100'}">${t.status}</span></td><td class="p-3"><button onclick="deleteTask('${t.id}')" class="text-red-500"><i class="fa-regular fa-trash-can"></i></button></td></tr>`; }).join('')}</tbody></table></div>
            </div>
        `;
    }
    
    function addTask() {
        const projectId = document.getElementById('taskProjectId')?.value;
        const name = document.getElementById('newTaskName')?.value.trim();
        const minutes = parseInt(document.getElementById('newTaskMinutes')?.value);
        const fee = parseInt(document.getElementById('newTaskFee')?.value);
        if (!projectId || !name || !minutes || !fee) { showToast('Isi semua field!', 'error'); return; }
        state.tasks.push({ id: "T" + (state.tasks.length + 1).toString().padStart(3, '0'), projectId: projectId, name: name, estMinutes: minutes, fee: fee, status: 'available' });
        saveAllData();
        renderManageTasks(document.getElementById('contentContainer'));
        showToast('Task ditambahkan');
    }
    
    function deleteTask(id) {
        if (confirm('Hapus task?')) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveAllData();
            renderManageTasks(document.getElementById('contentContainer'));
        }
    }
    
    function renderFinancialReport(container) {
        const totalIncome = state.ecommerce.reduce((sum, e) => sum + (e.total || 0), 0);
        const totalFeeOut = state.assignments.filter(a => a.completed).reduce((sum, a) => sum + (a.fee || 0), 0);
        const totalOperasional = state.operationalExpenses.reduce((sum, o) => sum + (o.amount || 0), 0);
        
        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
                    <h3 class="font-bold text-xl">📊 Laporan Keuangan</h3>
                    <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm"><i class="fa-solid fa-file-excel mr-2"></i> Export Excel</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-green-50 p-4 rounded-xl"><p class="text-sm">Pendapatan</p><p class="text-xl font-bold text-green-600">${formatRupiah(totalIncome)}</p></div>
                    <div class="bg-red-50 p-4 rounded-xl"><p class="text-sm">Fee Eksekutor</p><p class="text-xl font-bold text-red-600">${formatRupiah(totalFeeOut)}</p></div>
                    <div class="bg-yellow-50 p-4 rounded-xl"><p class="text-sm">Operasional</p><p class="text-xl font-bold text-yellow-600">${formatRupiah(totalOperasional)}</p></div>
                    <div class="bg-blue-50 p-4 rounded-xl"><p class="text-sm">Laba Bersih</p><p class="text-xl font-bold text-blue-600">${formatRupiah(totalIncome - totalFeeOut - totalOperasional)}</p></div>
                </div>
            </div>
        `;
    }
    
    function renderOperasional(container) {
        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
                <h3 class="font-bold mb-4">➕ Tambah Biaya Operasional</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="date" id="opDate" value="${new Date().toISOString().split('T')[0]}" class="border rounded-xl px-3 py-2">
                    <select id="opCategory" class="border rounded-xl px-3 py-2"><option>Hosting</option><option>Tools</option><option>Utilitas</option><option>Lainnya</option></select>
                    <input type="text" id="opDesc" placeholder="Keterangan" class="border rounded-xl px-3 py-2">
                    <input type="number" id="opAmount" placeholder="Nominal" class="border rounded-xl px-3 py-2">
                    <button onclick="addOperasional()" class="bg-indigo-600 text-white rounded-xl py-2">Simpan</button>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="border-b p-5"><h3 class="font-bold">📋 Riwayat</h3></div>
                <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3">Tanggal</th><th class="p-3">Kategori</th><th class="p-3">Keterangan</th><th class="p-3">Nominal</th><th class="p-3">Aksi</th></tr></thead><tbody>${state.operationalExpenses.map(o => `<tr class="border-t"><td class="p-3">${formatDate(o.date)}</td><td class="p-3">${o.category}</td><td class="p-3">${o.description}</td><td class="p-3 text-red-600">${formatRupiah(o.amount)}</td><td class="p-3"><button onclick="deleteOperasional('${o.id}')" class="text-red-500"><i class="fa-regular fa-trash-can"></i></button></td></tr>`).join('')}</tbody></table></div>
            </div>
        `;
    }
    
    function addOperasional() {
        const description = document.getElementById('opDesc')?.value.trim();
        const amount = parseInt(document.getElementById('opAmount')?.value);
        if (!description || !amount) { showToast('Isi keterangan dan nominal!', 'error'); return; }
        state.operationalExpenses.push({ id: "OP" + Date.now(), date: document.getElementById('opDate')?.value || new Date().toISOString(), category: document.getElementById('opCategory')?.value, description: description, amount: amount });
        saveAllData();
        renderOperasional(document.getElementById('contentContainer'));
        showToast('Biaya ditambahkan');
    }
    
    function deleteOperasional(id) {
        if (confirm('Hapus?')) {
            state.operationalExpenses = state.operationalExpenses.filter(o => o.id !== id);
            saveAllData();
            renderOperasional(document.getElementById('contentContainer'));
        }
    }
    
    function exportToExcel() {
        const wsData = [['LAPORAN KEUANGAN AGENCYOS'], ['Tanggal Export', new Date().toLocaleString()], [], ['RINGKASAN'], ['Total Pendapatan', formatRupiah(state.ecommerce.reduce((s,e)=>s+(e.total||0),0))], ['Total Fee', formatRupiah(state.assignments.filter(a=>a.completed).reduce((s,a)=>s+(a.fee||0),0))], ['Total Operasional', formatRupiah(state.operationalExpenses.reduce((s,o)=>s+(o.amount||0),0))]];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsData), "Laporan");
        XLSX.writeFile(wb, `Laporan_AgencyOS_${new Date().toISOString().split('T')[0]}.xlsx`);
        showToast('✅ Export berhasil!');
    }
    
    // ========== START APPLICATION ==========
    loadAllData();
    
    // Cek session
    const savedUser = sessionStorage.getItem('currentUser');
    if (savedUser) {
        try {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            initDashboard();
        } catch(e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
