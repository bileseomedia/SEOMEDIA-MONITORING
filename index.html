<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-800 to-pink-700 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl max-w-md w-full p-8 border border-white/20">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-chart-line text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">AgencyOS</h1>
            <p class="text-purple-200 text-sm">Task Management & Financial System</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-white text-sm font-semibold mb-2">
                    <i class="fa-solid fa-user mr-2"></i> Pilih Role
                </label>
                <select id="loginRole" class="w-full bg-white/20 border border-white/30 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-white">
                    <option value="eksekutor" class="text-gray-900">🔧 Eksekutor - Pengerja Task</option>
                    <option value="maker" class="text-gray-900">👑 Maker - Bos / Owner</option>
                </select>
            </div>
            <div>
                <label class="block text-white text-sm font-semibold mb-2">
                    <i class="fa-solid fa-signature mr-2"></i> Nama / Username
                </label>
                <input type="text" id="loginName" placeholder="Masukkan nama Anda" class="w-full bg-white/20 border border-white/30 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-white placeholder:text-purple-200">
            </div>
            <button onclick="doLogin()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition-all duration-300 shadow-lg">
                <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Masuk ke Dashboard
            </button>
        </div>

        <div class="mt-6 text-center text-xs text-purple-200">
            Demo: Eksekutor = "Andi" / Maker = "Bos"
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
